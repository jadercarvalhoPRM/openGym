# openGym — standalone web server: serves the static app AND proxies /api to the backend,
# so the whole app lives on ONE origin (required for WebAuthn / passkeys).
limit_req_zone $binary_remote_addr zone=opengym_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=opengym_auth:10m rate=2r/s;
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 5m;
    limit_req_status 429;
    set_real_ip_from 10.0.1.0/24;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    include /etc/nginx/snippets/security-headers.conf;

    location ~ ^/api/(register|login)/ {
        limit_req zone=opengym_auth burst=20 nodelay;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # API → backend container
    location /api/ {
        limit_req zone=opengym_api burst=60 nodelay;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # App shell: always revalidate so updates show up immediately
    location ~* \.(js|css|json|html)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Exercise images/GIFs never change → cache hard
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_vary on;
    gzip_min_length 1024;
}
