name: opengym
services:
  api:
    image: ${OPENGYM_API_IMAGE:-opengym-api:local}
    build:
      context: ./api
      args:
        REVISION: ${REVISION:-local}
    restart: unless-stopped
    environment:
      PORT: '3000'
      DATA_DIR: /data
      RP_ID: ${RP_ID:-localhost}
      ORIGIN: ${ORIGIN:-http://localhost:8080}
      RP_NAME: ${RP_NAME:-openGym}
      ADMIN_UIDS: ${ADMIN_UIDS:-}
      INVITE_ONLY: ${INVITE_ONLY:-0}
    volumes:
      - opengym_data:/data
    networks:
      private:
        aliases: [opengym_api]
  web:
    image: ${OPENGYM_WEB_IMAGE:-opengym-web:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REVISION: ${REVISION:-local}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:80'
    networks:
      - private
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/api/health']
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
networks:
  private:
volumes:
  opengym_data:
